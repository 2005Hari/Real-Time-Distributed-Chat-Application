# Render Blueprint for the backend (FastAPI + WebSocket). The frontend is deployed separately on Vercel.
services:
  - type: web
    name: quantumconnect-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pinned because the dependency versions in requirements.txt have no wheels for Python 3.13+.
      - key: PYTHON_VERSION
        value: 3.11.9
      # Your Vercel URL(s), comma-separated, no trailing slash. Set this in the Render dashboard.
      - key: ALLOWED_ORIGINS
        sync: false
      # Required to create an account. Share it only with the people you want in the chat.
      - key: INVITE_CODE
        sync: false
      # Signs login sessions. Generated once by Render and kept across deploys.
      - key: SECRET_KEY
        generateValue: true
      # PostgreSQL connection string (e.g. from Neon or Supabase). Render's free filesystem is wiped on
      # every deploy/restart, so accounts and history must live in an external database.
      - key: DATABASE_URL
        sync: false
