<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f5f1">
    <title>QuantumConnect</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='28' font-weight='700' text-anchor='middle' fill='white'%3EQC%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- SIGN-IN -->
    <div id="auth-screen">
        <form class="auth-card" id="auth-form" autocomplete="off">
            <div class="logo logo-lg">QC</div>
            <h1 class="auth-title">QuantumConnect</h1>
            <p class="auth-sub">Private team chat</p>

            <div class="tabs" role="tablist">
                <button type="button" role="tab" class="tab active" id="tab-login" aria-selected="true">Sign in</button>
                <button type="button" role="tab" class="tab" id="tab-register" aria-selected="false">Create account</button>
            </div>

            <div class="field">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" name="username" placeholder="e.g. alex.rivera" maxlength="24" autocomplete="username" spellcheck="false" required autofocus>
            </div>
            <div class="field">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" name="password" placeholder="At least 8 characters" maxlength="128" autocomplete="current-password" required>
            </div>
            <div class="field" id="invite-field" hidden>
                <label for="invite-input">Invite code</label>
                <input type="text" id="invite-input" name="invite" placeholder="Ask whoever invited you" maxlength="128" autocomplete="off" spellcheck="false">
            </div>
            <p class="auth-hint" id="auth-hint" hidden>Usernames are 3-24 characters: letters, numbers, spaces, dots, dashes or underscores.</p>

            <details class="advanced">
                <summary>Advanced</summary>
                <div class="field">
                    <label for="server-input">Server node</label>
                    <input type="text" id="server-input" placeholder="wss://your-backend.onrender.com/ws" spellcheck="false">
                </div>
            </details>

            <button type="submit" class="btn-primary" id="auth-btn">Sign in</button>
            <div id="auth-note" class="auth-note" role="status"></div>
            <div id="auth-error" class="auth-error" role="alert"></div>
        </form>
    </div>

    <!-- APP -->
    <div id="main-app">
        <div class="scrim" id="scrim"></div>

        <aside class="sidebar" id="sidebar" aria-label="Conversations">
            <div class="sidebar-header">
                <div class="logo">QC</div>
                <span class="brand">QuantumConnect</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-label">Channels</div>
                <button type="button" class="nav-item active" id="nav-public">
                    <span class="nav-icon">#</span>
                    <span class="nav-text">General</span>
                    <span class="badge" id="badge-public" hidden>0</span>
                </button>

                <div class="nav-label">Direct messages</div>
                <div id="dm-list"></div>

                <div class="nav-label">Online now <span class="count" id="online-count">0</span></div>
                <div id="online-list"></div>
            </nav>

            <div class="sidebar-footer">
                <div class="avatar" id="my-avatar">?</div>
                <div class="me-info">
                    <div class="me-name" id="my-name">-</div>
                    <div class="me-status" id="my-status">Offline</div>
                </div>
                <button type="button" class="icon-btn" id="signout-btn" title="Sign out" aria-label="Sign out">&#x21AA;</button>
            </div>
        </aside>

        <main class="chat" id="chat">
            <header class="chat-header">
                <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open conversations">&#9776;</button>
                <div class="chat-heading">
                    <div class="chat-title" id="chat-title">General</div>
                    <div class="chat-sub" id="chat-sub"></div>
                </div>
                <div class="conn-pill" id="conn-pill" data-state="offline"><span class="dot"></span><span id="conn-pill-text">Offline</span></div>
            </header>

            <div class="banner" id="conn-banner" hidden>
                <span id="banner-text"></span>
                <button type="button" id="banner-btn">Retry now</button>
            </div>

            <div class="messages" id="messages" aria-live="polite"></div>
            <button type="button" class="jump-btn" id="jump-btn" hidden>New messages &#8595;</button>

            <div class="status-row">
                <div class="typing" id="typing"></div>
                <div class="uploads" id="uploads"></div>
            </div>

            <form class="composer" id="composer">
                <button type="button" class="icon-btn" id="attach-btn" title="Attach a file" aria-label="Attach a file">&#128206;</button>
                <div class="input-wrap">
                    <textarea id="msg-input" rows="1" maxlength="4000" placeholder="Type a message" enterkeyhint="send"></textarea>
                    <button type="button" class="icon-btn" id="emoji-btn" title="Emoji" aria-label="Emoji">&#128522;</button>
                    <div class="emoji-pop" id="emoji-pop" hidden></div>
                </div>
                <button type="submit" class="icon-btn send-btn" id="send-btn" title="Send" aria-label="Send">&#10148;</button>
                <input type="file" id="file-input" hidden>
            </form>

            <div class="drop-hint" id="drop-hint">Drop a file to send it</div>
        </main>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
